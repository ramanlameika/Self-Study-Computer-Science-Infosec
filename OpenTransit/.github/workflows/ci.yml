name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "OpenTransit/**"
  pull_request:
    branches: [main]
    paths:
      - "OpenTransit/**"

defaults:
  run:
    working-directory: OpenTransit

jobs:
  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth:
    name: Auth Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenTransit/services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OpenTransit/services/auth/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: OpenTransit/services/auth/coverage.xml
          flags: auth

  # ── Ticketing Service ─────────────────────────────────────────────────────────
  ticketing:
    name: Ticketing Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenTransit/services/ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OpenTransit/services/ticketing/requirements.txt
      - name: Install system deps
        run: sudo apt-get install -y libzbar0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: OpenTransit/services/ticketing/coverage.xml
          flags: ticketing

  # ── Fare Service ──────────────────────────────────────────────────────────────
  fare:
    name: Fare Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenTransit/services/fare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OpenTransit/services/fare/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: OpenTransit/services/fare/coverage.xml
          flags: fare

  # ── Agency Service ────────────────────────────────────────────────────────────
  agency:
    name: Agency Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenTransit/services/agency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OpenTransit/services/agency/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: OpenTransit/services/agency/coverage.xml
          flags: agency

  # ── Payment Service ───────────────────────────────────────────────────────────
  payment:
    name: Payment Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenTransit/services/payment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OpenTransit/services/payment/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: OpenTransit/services/payment/coverage.xml
          flags: payment

  # ── Lint (all services) ───────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff
      - name: Ruff lint
        run: ruff check OpenTransit/services/
